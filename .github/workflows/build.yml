name: Build playlist and guide

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: >
          python3 build.py --out out
          --base-url "https://raw.githubusercontent.com/${{ github.repository }}/data"
      - name: Publish to the data branch
        working-directory: out
        run: |
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add english.m3u8 guide.xml.gz
          git commit -q -m "Update playlist and guide"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
